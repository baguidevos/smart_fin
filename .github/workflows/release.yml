name: Build & Release SmartFin

on:
  push:
    branches:
      - release
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Verify code (Analyze & Test)
        run: |
          flutter analyze
          flutter test

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      - name: 🏷️ Determine Version / Tag
        id: get_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d '+' -f 1)
          TAG_NAME="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: 📋 Prepare Artifacts
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/SmartFin-${{ steps.get_version.outputs.tag }}.apk

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "SmartFin ${{ steps.get_version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/SmartFin-${{ steps.get_version.outputs.tag }}.apk
          body: |
            ### 🎉 SmartFin ${{ steps.get_version.outputs.tag }}

            Application mobile de gestion financière personnelle intelligente (devise FCFA, 100 % hors-ligne).

            #### 🌟 Nouveautés de la version ${{ steps.get_version.outputs.tag }} :
            * 📐 **Règle d'or financière des Enveloppes Budgétaires** : Déduction automatique des virements internes sortants et cotisations de l'allocation nette pour garantir une concordance comptable parfaite avec les soldes de l'onglet Comptes (`Solde = Alloué net − Consommé`).
            * 🛡️ **Élimination du risque de double comptage** : Séparation stricte entre flux de trésorerie interne et dépenses réelles de consommation.
            * 🧪 **Fiabilisation du scénario de démonstration** : Correction des montants de cotisations dans `seedDemo()` pour éliminer l'erreur de solde insuffisant.
            * 📄 **Documentation d'audit financier** : Intégration du guide de référence sur la cohérence des enveloppes budgétaires.

            #### 📲 Installation :
            Téléchargez le fichier APK ci-dessous pour installer ou mettre à jour SmartFin sur votre appareil Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
